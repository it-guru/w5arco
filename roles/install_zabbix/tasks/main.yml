---
- name: "install ZABBIX Agent on unix"
  tags: [install_zabbix]
  when: 
     - ansible_os_family != "Windows"
     - zabbix_install | bool is true
  block:
   - name: "create zabbix group - gid does not matter"
     ansible.builtin.group:
       name: zabbix
       state: present
     become: true

   - name: "Check if zabbix exists in passwd database"
     ansible.builtin.getent:
       database: passwd
       key: "zabbix"
     register: zabbix_user_check
     failed_when: false
     changed_when: zabbix_user_check is failed

   - name: "create zabbix user - uid does not matter"
     ansible.builtin.user:
       name: zabbix
       state: present
       create_home: yes
       expires: -1
       comment: zabbix monitoring user
     become: true
     when:
       - zabbix_user_check.changed is true

   - name: "check ansible file cache dir"
     ansible.builtin.file:
        state: directory
        path: "/var/cache/ansible"
        owner: "root"
        group: "root"
        mode: '0750'
     become: true

   - name: check cache dir
     stat: path="/var/cache/ansible"
     register: AnsibleCacheDir
     become: true

   - name: "check /opt/zabbix_agent target directory"
     ansible.builtin.file:
        state: directory
        path: "/opt/zabbix_agent"
        owner: "zabbix"
        group: "zabbix"
        mode: '0755'
     become: true
     when: 
        - not ansible_check_mode 

   - name: check already installed Zabbix Agent
     ansible.builtin.stat:
       path: "/opt/zabbix_agent/sbin/zabbix_agentd"
     register: alreadyInst
     become: true

   - name: create directory for ansible server cache dir
     file:
       path: "{{ansiblesrv_var_base}}/webcache/zabbix/"
       state: directory
       mode: '2770'
     run_once: true
     delegate_to: localhost


   - name: "Download file with cache handling on ansible control node"
     block: 
      - name: "Download latest zabbix client from Zabbix Site"
        ansible.builtin.get_url:
          url: "{{zabbix_agent_srcbase}}/{{zabbix_unix_agent_srcfile}}"
          dest: "{{ansiblesrv_var_base}}/webcache/zabbix/{{zabbix_unix_agent_srcfile}}"
          backup: true
          use_netrc: false
          timeout: 60
          force: true
          mode: 0660
          group: ansible
        ignore_errors: yes
        delegate_to: localhost
        register: DownloadResult

      # touch is needed, because ansible not updates mdate on successfull
      # download from source-url
      - name: "touch file, if download was OK"
        file:
          state: "touch"
          path: "{{ansiblesrv_var_base}}/webcache/zabbix/{{zabbix_unix_agent_srcfile}}"
          modification_time: "now"
        ignore_errors: true
        changed_when: false
        when:
          - DownloadResult.status_code==200
        delegate_to: localhost

      - name: find all webcache files older than 30 days
        find:
          paths: "{{ansiblesrv_var_base}}/webcache/zabbix"
          age: 30d
          recurse: yes
        register: oldFiles
        delegate_to: localhost

      - name: remove older than 30 days
        file:
          path: "{{ item.path }}" 
          state: absent
        with_items: "{{ oldFiles.files }}"
        delegate_to: localhost
     rescue:
      - name: "rescue WebCache donwload-Handling"
        debug:
          msg: "error ocured - there is need to handle it manualy"

   - name: check local (ansible server) cache
     ansible.builtin.stat:
       path: "{{ansiblesrv_var_base}}/webcache/zabbix/{{zabbix_unix_agent_srcfile}}"
     register: localCache
     delegate_to: localhost

   - name: "Fail to find a webCached {{zabbix_unix_agent_srcfile}}"
     fail:
       msg: "Whoops! can not find a useable {{zabbix_unix_agent_srcfile}}"
     when: localCache.stat.exists is false
     delegate_to: localhost


   - name: Copy file
     ansible.builtin.copy:
       src: "{{ansiblesrv_var_base}}/webcache/zabbix/{{zabbix_unix_agent_srcfile}}"
       dest: "/var/cache/ansible"
     when: AnsibleCacheDir.stat.exists==true
     become: true

   - name: "transfer local cached {{zabbix_unix_agent_srcfile}} to remote system"
     copy:
       src: "{{localCache.stat.path}}"
       dest: "/var/cache/ansible/{{zabbix_unix_agent_srcfile}}"
     when: localCache.stat.exists
     become: true

   - name: check remote cache
     ansible.builtin.stat:
       path: "/var/cache/ansible/{{zabbix_unix_agent_srcfile}}"
     register: remoteCache
     become: true

   - name: "run remote unpack of zabbix agent"
     shell: "mkdir /tmp/zabbixinst.temp;tar -xvf /var/cache/ansible/{{zabbix_unix_agent_srcfile}}  -C /tmp/zabbixinst.temp"
     ignore_errors: true
     when: 
        - remoteCache.stat.exists is true
        - alreadyInst.stat.exists is false
     become: true

   - name: Install Zabbix Agent
     ansible.builtin.shell: "./install.sh -ignore_install_in_root -ni -proxyip {{zabbix_proxyip}} >> zabbix_install_log.txt"
     args:
       chdir: /tmp/zabbixinst.temp/zabbix_installer
       creates: /opt/zabbix_agent/sbin/zabbix_agentd
     when: 
        - remoteCache.stat.exists is true
        - alreadyInst.stat.exists is false
        - not ansible_check_mode
     notify: restartzabbix
     become: true

   - name: "cleanup temp dir /tmp/zabbixinst.temp"
     ansible.builtin.file:
        state: absent
        path: "/tmp/zabbixinst.temp"
     when: 
        - alreadyInst.stat.exists is false
     become: true

  rescue:
   - name: "block rescue to ensure following roles processing"
     debug:
       msg: "error ocured - there is need to handle it manualy"





- name: "install ZABBIX Agent on Windows"
  tags: [install_zabbix]
  when: 
     - ansible_os_family == "Windows"
     - zabbix_install | bool is true
  block:
      - name: "Check if Zabbix is already installed"
        ansible.windows.win_stat:
          path: 'D:\zabbix_agent\bin\zabbix_agentd.exe'
        register: zabbix_agentd_exe

      - name: "Download zabbix.zip windows package"
        ansible.windows.win_get_url:
          url: "{{zabbix_agent_srcbase}}/{{zabbix_win_agent_srcfile}}"
          dest: 'C:\Windows\Temp\zabbix.zip'
          validate_certs: false
        when: not zabbix_agentd_exe.stat.exists

      - name: "Extract zabbix.zip in Windows/Temp"
        community.windows.win_unzip:
          src: 'C:\Windows\Temp\zabbix.zip'
          dest: 'C:\Windows\Temp'
          create_dirs: yes
        when: not zabbix_agentd_exe.stat.exists

      - name: "set sourcedir"
        set_fact:
          zabbix_src_dir: 'C:\Windows\Temp\ZABBIX_AGENT_6.0.44_WIN_V1.7'

      - name: "create Zabbix Firewall-Rule and install Agent"
        ansible.windows.win_powershell:
         script: |
          $ErrorActionPreference = 'Stop'

          $ruleName = 'Zabbix Proxy Connection'
          if (-not (Get-NetFirewallRule -DisplayName $ruleName -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule `
                  -DisplayName $ruleName `
                  -Direction Inbound `
                  -Action Allow `
                  -Protocol TCP `
                  -LocalPort 10050 | Out-Null
          }
          net.exe user X15721599 /domain
          if ($LASTEXITCODE -ne 0) {
              throw "net user X15721599 /domain fail(ExitCode: $LASTEXITCODE)"
          }

          if (-not (Test-Path -Path '{{zabbix_src_dir}}')) {
              throw "Directory not found: {{zabbix_src_dir}}"
          }

          Set-Location -Path '{{zabbix_src_dir}}'
          & cmd.exe /c "install_agent.cmd -proxy_ip {{zabbix_proxyip}}"
          if ($LASTEXITCODE -ne 0) {
              throw "install_agent.cmd failed (ExitCode: $LASTEXITCODE)"
          }
        when: not zabbix_agentd_exe.stat.exists

      - name: "Clean up temporary zabbix installation files"
        ansible.windows.win_file:
          path: '{{ item }}'
          state: absent
        loop:
          - 'C:\Windows\Temp\zabbix.zip'
          - 'C:\Windows\Temp\ZABBIX_AGENT_6.0.44_WIN_V1.7'

  rescue:
   - name: "block rescue to ensure following roles processing"
     debug:
       msg: "error ocured - there is need to handle it manualy"

